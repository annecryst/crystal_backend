name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier spin-down (15 min inactivity timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging backend at $(date -u)"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://crystal-backend-rrem.onrender.com)
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️ Backend responded with status $HTTP_STATUS"
          fi
